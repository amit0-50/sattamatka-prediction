<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sattamatka Prediction</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10051f;color:white;font-family:Arial,sans-serif}
header{background:#260b46;padding:22px;text-align:center;border-bottom:2px solid #c15aff}
h1{color:#e6a5ff;margin:0}
main{max-width:650px;margin:20px auto;padding:12px}
.card{background:#211035;border:1px solid #9146c5;border-radius:14px;padding:18px;margin:15px 0}
h2{color:#dda3ff}
input,textarea{width:100%;padding:13px;margin:8px 0;background:#160b24;color:white;border:1px solid #9146c5;border-radius:8px}
button{padding:12px;background:#9b3bd1;color:white;border:0;border-radius:8px;font-size:15px;margin:5px 0;cursor:pointer}
.full{width:100%}
.record{border:1px solid #70408c;border-radius:9px;padding:12px;margin:10px 0;overflow-wrap:anywhere}
.small{color:#cbb8d9;font-size:13px}
#dashboard{display:none}
#message{color:#e6a5ff;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>Sattamatka Prediction</h1>
<p>जानकारी एवं रिकॉर्ड पोर्टल</p>
</header>

<main>
<section class="card" id="home">
<h2>आपका स्वागत है</h2>
<p>यहाँ सामान्य जानकारी और गैर-जुआ रिकॉर्ड उपलब्ध होंगे।</p>
</section>

<section class="card" id="login">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="ईमेल">
<input id="password" type="password" placeholder="पासवर्ड">
<button class="full" onclick="login()">Login करें</button>
<p id="message"></p>
</section>

<section id="dashboard">
<div class="card">
<h2>Admin Dashboard</h2>
<p id="adminEmail" class="small"></p>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h2>नया रिकॉर्ड जोड़ें</h2>
<input id="recordTitle" placeholder="रिकॉर्ड का शीर्षक">
<textarea id="recordDescription" rows="4" placeholder="रिकॉर्ड की जानकारी लिखें"></textarea>
<button class="full" onclick="addRecord()">रिकॉर्ड सेव करें</button>
<p id="saveMessage"></p>
</div>

<div class="card">
<h2>सभी रिकॉर्ड</h2>
<button onclick="loadRecords()">रिकॉर्ड रिफ्रेश करें</button>
<div id="recordsList">रिकॉर्ड लोड हो रहे हैं...</div>
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://svdevczfllkvvlcxuovf.supabase.co";
const SUPABASE_KEY = "sb_publishable_yWbdGJJ9HFm9WXvQ1eBwOw_tLLkt9Sx";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");
  message.textContent = "जाँच हो रही है...";
  const {data,error} = await client.auth.signInWithPassword({email,password});
  if(error){message.textContent = "त्रुटि: " + error.message;return;}
  showDashboard(data.user);
}

function showDashboard(user){
  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  document.getElementById("adminEmail").textContent = "लॉगिन: " + user.email;
  loadRecords();
}

async function logout(){
  await client.auth.signOut();
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("password").value = "";
  document.getElementById("message").textContent = "आप लॉगआउट हो गए हैं।";
}

async function addRecord(){
  const title = document.getElementById("recordTitle").value.trim();
  const description = document.getElementById("recordDescription").value.trim();
  const msg = document.getElementById("saveMessage");

  if(!title || !description){
    msg.textContent = "कृपया दोनों जानकारी भरें।";
    return;
  }

  msg.textContent = "रिकॉर्ड सेव हो रहा है...";
  const {error} = await client.from("records").insert([{title,description}]);

  if(error){
    msg.textContent = "सेव नहीं हुआ: " + error.message;
    return;
  }

  document.getElementById("recordTitle").value = "";
  document.getElementById("recordDescription").value = "";
  msg.textContent = "रिकॉर्ड सफलतापूर्वक सेव हुआ।";
  loadRecords();
}

async function loadRecords(){
  const list = document.getElementById("recordsList");
  list.textContent = "लोड हो रहा है...";

  const {data,error} = await client
    .from("records")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    list.textContent = "रिकॉर्ड नहीं मिले: " + error.message;
    return;
  }

  list.replaceChildren();

  if(!data.length){
    list.textContent = "अभी कोई रिकॉर्ड नहीं है।";
    return;
  }

  data.forEach(record=>{
    const card = document.createElement("div");
    card.className = "record";

    const heading = document.createElement("h3");
    heading.textContent = record.title;

    const desc = document.createElement("p");
    desc.textContent = record.description;

    const date = document.createElement("p");
    date.className = "small";
    date.textContent = record.created_at
      ? new Date(record.created_at).toLocaleString("hi-IN")
      : "";

    const del = document.createElement("button");
    del.textContent = "डिलीट करें";
    del.onclick = ()=>deleteRecord(record.id);

    card.append(heading,desc,date,del);
    list.appendChild(card);
  });
}

async function deleteRecord(id){
  if(!confirm("क्या आप यह रिकॉर्ड डिलीट करना चाहते हैं?")) return;

  const {error} = await client.from("records").delete().eq("id",id);

  if(error){
    alert("डिलीट नहीं हुआ: " + error.message);
    return;
  }

  alert("रिकॉर्ड डिलीट हो गया।");
  loadRecords();
}

async function checkSession(){
  const {data} = await client.auth.getSession();
  if(data.session) showDashboard(data.session.user);
}

checkSession();
</script>
</body>
</html>
